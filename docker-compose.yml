version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: icyquant-api
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - kafka
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql://icyquant:password@postgres:5432/icyquant
      - REDIS_URL=redis://redis:6379/0
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    command: >
      bash -c "
      alembic upgrade head &&
      uvicorn apps.api.main:app --host 0.0.0.0 --port 8000
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: icyquant-worker
    command: python -m apps.worker.main
    depends_on:
      - postgres
      - redis
      - kafka
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql://icyquant:password@postgres:5432/icyquant
      - REDIS_URL=redis://redis:6379/0
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092

  postgres:
    image: postgres:16
    container_name: icyquant-postgres
    environment:
      POSTGRES_USER: icyquant
      POSTGRES_PASSWORD: password
      POSTGRES_DB: icyquant
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U icyquant"]
      interval: 5s
      timeout: 3s
      retries: 3

  redis:
    image: redis:7
    container_name: icyquant-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  kafka:
    image: bitnami/kafka:3.8
    container_name: icyquant-kafka
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9092:9092"

volumes:
  postgres_data:
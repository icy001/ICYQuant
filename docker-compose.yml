version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: icyquant
      POSTGRES_PASSWORD: icyquant
      POSTGRES_DB: icyquant
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  reconciliation:
    build: ./services/reconciliation
    depends_on:
      - postgres
      - redis

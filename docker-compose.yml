version: "3.9"

services:

  api:

    build:

      context: .

    container_name:

      icyquant-api

    ports:

      - "8000:8000"

    depends_on:

      - postgres

      - redis

    environment:

      DATABASE_URL:

        postgresql://icyquant:password@postgres:5432/icyquant

      REDIS_URL:

        redis://redis:6379

    command: >

      bash -c "

      alembic upgrade head &&

      uvicorn apps.api.main:app --host 0.0.0.0 --port 8000

      "

  worker:

    build:

      context: .

    container_name:

      icyquant-worker

    command:

      python -m services.worker

    depends_on:

      - postgres

      - redis

  postgres:

    image:

      postgres:16

    container_name:

      icyquant-postgres

    environment:

      POSTGRES_USER:

        icyquant

      POSTGRES_PASSWORD:

        password

      POSTGRES_DB:

        icyquant

    volumes:

      - postgres_data:/var/lib/postgresql/data

      - ./config/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

    ports:

      - "5432:5432"

  redis:

    image:

      redis:7

    container_name:

      icyquant-redis

    ports:

      - "6379:6379"

volumes:

  postgres_data:
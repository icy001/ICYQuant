[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ICYQuant"
version = "0.3.0"
description = "Quantitative Trading Framework"
requires-python = ">=3.9"

[project.scripts]
icyquant = "services.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["services", "research", "contracts", "common", "infrastructure"]
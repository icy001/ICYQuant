[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "icyquant-sdk"
version = "0.4.0"
description = "ICYQuant Platform Python SDK - 机构级量化交易平台软件开发工具包"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "ICYQuant Team", email = "platform@icyquant.io"},
]
keywords = [
    "quant",
    "trading",
    "ai",
    "finance",
    "hedge-fund",
    "algorithmic-trading",
    "institutional",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "cryptography>=41.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
full = [
    "websockets>=12.0",
    "redis>=5.0",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "kafka-python>=2.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://icyquant.io"
Repository = "https://github.com/icyquant/icyquant"
Documentation = "https://docs.icyquant.io"
Issues = "https://github.com/icyquant/icyquant/issues"
Changelog = "https://github.com/icyquant/icyquant/releases"

[project.scripts]
icyquant-sdk = "icyquant_sdk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["icyquant_sdk*"]

[tool.setuptools.package-data]
icyquant_sdk = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2003"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow",
    "integration: marks integration tests",
    "e2e: marks end-to-end tests",
]
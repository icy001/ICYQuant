# =============================================================================
# ICYQuant RC1 Kubernetes Deployment Templates
# Production-ready deployments for all services
# =============================================================================

---
# =============================================================================
# API Gateway Service
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: icyquant-gateway
  labels:
    app.kubernetes.io/name: icyquant
    app.kubernetes.io/component: gateway
    app.kubernetes.io/version: "0.4.0-alpha1"
    app.kubernetes.io/managed-by: helm
spec:
  replicas: 3
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: icyquant
      app.kubernetes.io/component: gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: icyquant
        app.kubernetes.io/component: gateway
        app.kubernetes.io/version: "0.4.0-alpha1"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: icyquant
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: icyquant/platform:0.4.0-alpha1
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: ICYQUANT_ENV
              value: "production"
            - name: ICYQUANT_SERVICE
              value: "gateway"
            - name: ICYQUANT_LOG_LEVEL
              value: "INFO"
          envFrom:
            - configMapRef:
                name: icyquant-config
            - secretRef:
                name: icyquant-secrets
          resources:
            limits:
              cpu: "2000m"
              memory: "4Gi"
            requests:
              cpu: "1000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: icyquant
                    app.kubernetes.io/component: gateway
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: icyquant
              app.kubernetes.io/component: gateway


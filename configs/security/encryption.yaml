# ICYQuant Encryption Configuration
encryption:
  at_rest:
    default_algorithm: aes-256-gcm
    enabled: true
    key_rotation_interval_days: 90
    providers:
      - type: local
        enabled: true
      - type: aws_kms
        enabled: false
      - type: azure_key_vault
        enabled: false
      - type: gcp_kms
        enabled: false

  in_transit:
    minimum_tls_version: "1.3"
    cipher_suites:
      - TLS_AES_256_GCM_SHA384
      - TLS_CHACHA20_POLY1305_SHA256
    require_mtls:
      internal_services: true
      external_services: false

  field_level:
    enabled: true
    searchable_encryption: true
    fields:
      - name: account_number
        algorithm: aes-256-gcm
        searchable: true
      - name: ssn
        algorithm: aes-256-gcm
        searchable: false
      - name: credit_card
        algorithm: aes-256-gcm
        searchable: false
      - name: bank_account
        algorithm: aes-256-gcm
        searchable: true

  key_management:
    master_key_provider: hsm
    key_wrapping_enabled: true
    auto_rotation: true
    rotation_interval_days: 90

# AutoML Multi-Objective Configuration
# =====================================
# Defines evaluation metrics, weights, and directions
# for composite model scoring.

# Default evaluation config
default:
  metrics:
    - sharpe
    - sortino
    - max_drawdown
    - calmar
    - win_rate
    - ic_mean
    - rank_ic
    - stability
  weights:
    sharpe: 0.25
    sortino: 0.15
    max_drawdown: 0.10
    calmar: 0.10
    ic_mean: 0.15
    rank_ic: 0.10
    stability: 0.10
    win_rate: 0.05
  directions:
    sharpe: "maximize"
    sortino: "maximize"
    max_drawdown: "minimize"
    calmar: "maximize"
    win_rate: "maximize"
    ic_mean: "maximize"
    rank_ic: "maximize"
    stability: "maximize"
  risk_free_rate: 0.02
  periods_per_year: 252
  composite_method: "weighted_sum"


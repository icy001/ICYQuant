# Factor Engineering Pipeline Configuration
# Generates technical and cross-sectional factors for ML models.

pipeline:
  name: factor_pipeline
  description: "Technical factor generation pipeline"
  source: market_data

  # Transformation steps
  transforms:
    # Price-based
    - return_1d
    - return_5d
    - return_20d
    - log_return_1d
    - log_return_5d

    # Moving averages
    - sma_5
    - sma_10
    - sma_20
    - sma_60
    - ema_12
    - ema_26
    - ema_50

    # Momentum & trend
    - momentum_5
    - momentum_10
    - momentum_20
    - roc_5
    - roc_10
    - roc_20

    # Volatility
    - volatility_5
    - volatility_10
    - volatility_20
    - atr_7
    - atr_14

    # Oscillators
    - rsi_7
    - rsi_14
    - rsi_21
    - stochastic_14
    - williams_r_14

    # Volume
    - volume_ratio_5
    - volume_ratio_20
    - obv              # On-Balance Volume
    - vwap_deviation   # Deviation from VWAP

    # Cross-sectional
    - zscore_20        # 20-period z-score
    - rank_pct_20      # 20-period percentile rank
    - relative_strength_20

  # Validation
  validate:
    enabled: true
    rules:
      - no_missing_columns
      - no_all_nan
      - no_all_zero
      - row_count_consistency
      - min_sample_count
    expected_columns:
      - return_1d
      - momentum_20
      - volatility_20
      - rsi_14
    min_rows: 500

  # Feature selection
  select:
    enabled: true
    max_features: 200
    filters:
      - type: variance
        threshold: 0.00001
      - type: correlation
        threshold: 0.90
      - type: mutual_info
        k: 150

  # Publishing
  publish:
    to: feature_store
    category: technical_factors
    tags:
      - daily
      - factor
      - technical
      - cross_sectional

  # Caching
  cache:
    enabled: true
    policy: hash
    ttl_seconds: 86400

  # Scheduling
  schedule:
    trigger: "cron:0 2 * * 1-5"  # 2:00 AM, Mon-Fri
    timezone: "Asia/Shanghai"
    catch_up: false

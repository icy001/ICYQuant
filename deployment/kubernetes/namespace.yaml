apiVersion: v1
kind: Namespace
metadata:
  name: icyquant
  labels:
    app.kubernetes.io/part-of: icyquant
    app.kubernetes.io/managed-by: icyquant-operator
    environment: production
  annotations:
    description: "ICYQuant Production Namespace"
    network-policy: strict
    pod-security: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: icyquant-quota
  namespace: icyquant
spec:
  hard:
    requests.cpu: "32"
    requests.memory: "64Gi"
    limits.cpu: "64"
    limits.memory: "128Gi"
    persistentvolumeclaims: "50"
    pods: "200"
    services: "50"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: icyquant-limits
  namespace: icyquant
spec:
  limits:
    - type: Container
      default:
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      max:
        cpu: "4"
        memory: "8Gi"
      min:
        cpu: "50m"
        memory: "64Mi"
    - type: Pod
      max:
        cpu: "16"
        memory: "32Gi"
apiVersion: v1
kind: ServiceAccount
metadata:
  name: icyquant-api-sa
  namespace: icyquant
  labels:
    app: icyquant-api
  annotations:
    description: "Service account for ICYQuant API"
    kubernetes.io/enforce-mountable-secrets: "true"
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: icyquant-ai-sa
  namespace: icyquant
  labels:
    app: icyquant-ai
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: icyquant-operator-sa
  namespace: icyquant
  labels:
    app: icyquant-operator
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: icyquant-api-role
  namespace: icyquant
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["icyquant-secrets"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: icyquant-api-rolebinding
  namespace: icyquant
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: icyquant-api-role
subjects:
  - kind: ServiceAccount
    name: icyquant-api-sa
    namespace: icyquant
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: icyquant-operator-role
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: icyquant-operator-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: icyquant-operator-role
subjects:
  - kind: ServiceAccount
    name: icyquant-operator-sa
    namespace: icyquant
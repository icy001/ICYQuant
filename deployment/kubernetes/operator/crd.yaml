apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: icyquantdeployments.icyquant.io
  labels:
    app.kubernetes.io/managed-by: icyquant-operator
spec:
  group: icyquant.io
  names:
    kind: ICYQuantDeployment
    listKind: ICYQuantDeploymentList
    plural: icyquantdeployments
    singular: icyquantdeployment
    shortNames:
      - iqd
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - image
                - service
              properties:
                service:
                  type: string
                  enum:
                    - api
                    - ai
                    - risk
                    - market-gateway
                    - portfolio
                    - strategy
                    - execution
                    - reconciliation
                image:
                  type: string
                replicas:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 3
                version:
                  type: string
                  description: "Semantic version tag"
                resources:
                  type: object
                  properties:
                    requests:
                      type: object
                      properties:
                        cpu:
                          type: string
                        memory:
                          type: string
                    autoscaling:
                      type: object
                      properties:
                        minReplicas:
                          type: integer
                          default: 2
                        maxReplicas:
                          type: integer
                          default: 10
                        targetCPUUtilization:
                          type: integer
                          default: 70
                    canary:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                          default: false
                        weight:
                          type: integer
                          minimum: 0
                          maximum: 100
                          default: 0
                        autoPromotion:
                          type: boolean
                          default: true
                    blueGreen:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                          default: false
                        activeColor:
                          type: string
                          enum:
                            - blue
                            - green
                    healthCheck:
                      type: object
                      properties:
                        endpoint:
                          type: string
                          default: /health
                        interval:
                          type: integer
                          default: 10
                        timeout:
                          type: integer
                          default: 5
                        retries:
                          type: integer
                          default: 3
                labels:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                env:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      value:
                        type: string
                    required:
                      - name
            status:
              type: object
              properties:
                state:
                  type: string
                  enum:
                    - Pending
                    - Deploying
                    - Running
                    - Degraded
                    - Failed
                    - Scaling
                    - Rolling
                readyReplicas:
                  type: integer
                desiredReplicas:
                  type: integer
                canaryWeight:
                  type: integer
                lastTransitionTime:
                  type: string
                  format: date-time
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Service
          type: string
          jsonPath: .spec.service
        - name: Version
          type: string
          jsonPath: .spec.version
        - name: Status
          type: string
          jsonPath: .status.state
        - name: Replicas
          type: integer
          jsonPath: .status.readyReplicas
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: icyquantservices.icyquant.io
  labels:
    app.kubernetes.io/managed-by: icyquant-operator
spec:
  group: icyquant.io
  names:
    kind: ICYQuantService
    listKind: ICYQuantServiceList
    plural: icyquantservices
    singular: icyquantservice
    shortNames:
      - iqs
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                type:
                  type: string
                  enum:
                    - stateful
                    - stateless
                    - batch
                replicas:
                  type: integer
                strategy:
                  type: string
                  enum:
                    - canary
                    - blue-green
                    - rolling
                healthCheck:
                  type: object
                  properties:
                    path:
                      type: string
                    port:
                      type: integer
            status:
              type: object
              properties:
                state:
                  type: string
                endpoint:
                  type: string
      subresources:
        status: {}
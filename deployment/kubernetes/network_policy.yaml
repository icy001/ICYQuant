apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: icyquant-default-deny
  namespace: icyquant
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: icyquant-api-netpol
  namespace: icyquant
spec:
  podSelector:
    matchLabels:
      app: icyquant-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              name: istio-system
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 9090
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: icyquant-redis
          ports:
            - protocol: TCP
              port: 6379
        - podSelector:
            matchLabels:
              app: icyquant-postgres
          ports:
            - protocol: TCP
              port: 5432
        - podSelector:
            matchLabels:
              app: icyquant-kafka
          ports:
            - protocol: TCP
              port: 9092
        - namespaceSelector:
            matchLabels:
              name: kube-system
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: icyquant-ai-netpol
  namespace: icyquant
spec:
  podSelector:
    matchLabels:
      app: icyquant-ai
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: icyquant-api
      ports:
        - protocol: TCP
          port: 8081
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: icyquant-redis
          ports:
            - protocol: TCP
              port: 6379
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 9090
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: icyquant
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
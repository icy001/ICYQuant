apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: icyquant-api-dr
  namespace: icyquant
spec:
  host: icyquant-api
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 50
        http2MaxRequests: 200
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
    tls:
      mode: ISTIO_MUTUAL
  subsets:
    - name: stable
      labels:
        version: stable
    - name: canary
      labels:
        version: canary
    - name: blue
      labels:
        version: blue
    - name: green
      labels:
        version: green
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: icyquant-ai-dr
  namespace: icyquant
spec:
  host: icyquant-ai
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 200
      http:
        http1MaxPendingRequests: 100
        http2MaxRequests: 500
    outlierDetection:
      consecutive5xxErrors: 3
      interval: 10s
      baseEjectionTime: 10s
      maxEjectionPercent: 100
    tls:
      mode: ISTIO_MUTUAL
  subsets:
    - name: stable
      labels:
        version: stable
    - name: canary
      labels:
        version: canary
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: icyquant-redis-dr
  namespace: icyquant
spec:
  host: icyquant-redis
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 2000
      http:
        http1MaxPendingRequests: 1000
    outlierDetection:
      consecutive5xxErrors: 3
      interval: 10s
      baseEjectionTime: 5s
    tls:
      mode: ISTIO_MUTUAL
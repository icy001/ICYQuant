apiVersion: v1
kind: Secret
metadata:
  name: icyquant-repo-creds
  namespace: argocd
type: Opaque
stringData:
  username: "${GITHUB_USERNAME}"
  password: "${GITHUB_TOKEN}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: icyquant-repo-config
  namespace: argocd
data:
  url: https://github.com/icyquant/icyquant-infra.git
  type: git
  branch: main
  path: deployment/kubernetes
  sshPrivateKey: ""
  enableLfs: "true"
---
apiVersion: argoproj.io/v1alpha1
kind: Repository
metadata:
  name: icyquant-infra
  namespace: argocd
  labels:
    app.kubernetes.io/managed-by: argocd
spec:
  url: https://github.com/icyquant/icyquant-infra.git
  type: git
  insecure: false
  # credentialTemplate:
  #   name: icyquant-repo-creds
  project: "*"
  connectionState:
    status: Successful
    message: "Repository connected successfully"
    attemptAt: "2024-01-01T00:00:00Z"
  gitHubApp:
    appPrivateKey: ""
    appId: ""
    installationId: ""
---
apiVersion: argoproj.io/v1alpha1
kind: Repository
metadata:
  name: icyquant-helm-charts
  namespace: argocd
spec:
  url: https://helm.icyquant.io
  type: helm
  insecure: false
  project: "*"
  connectionState:
    status: Successful
    message: "Helm repository connected successfully"
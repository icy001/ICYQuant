<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ICYQuant Trading Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230b1220'/><path d='M20 70 L40 45 L55 58 L80 28' stroke='%2300e5a0' stroke-width='6' fill='none' stroke-linecap='round'/></svg>">
  <link rel="stylesheet" href="/dashboard/css/app.css">
</head>
<body>

  <!-- ===================== Login ===================== -->
  <div id="login-view" class="hidden">
    <div class="login-wrap">
      <div class="login-card">
        <div class="login-logo"><span class="logo-icy">ICY</span><span class="logo-quant">Quant</span></div>
        <div class="login-sub">Trading Dashboard</div>
        <form id="login-form" autocomplete="on">
          <label class="field">
            <span>Username</span>
            <input id="login-username" type="text" placeholder="admin" autocomplete="username" required>
          </label>
          <label class="field">
            <span>Password</span>
            <input id="login-password" type="password" placeholder="••••••••" autocomplete="current-password" required>
          </label>
          <button type="submit" class="btn btn-primary btn-block" id="login-btn">Sign In</button>
        </form>
        <div id="login-error" class="login-error hidden"></div>
        <div class="login-hint">
          <div>Demo accounts</div>
          <code>admin/admin123</code> <code>trader/trader123</code> <code>risk/risk123</code>
          <code>operator/operator123</code> <code>researcher/researcher123</code> <code>readonly/readonly123</code>
        </div>
      </div>
    </div>
  </div>

  <!-- ===================== App ===================== -->
  <div id="app-view" class="hidden">
    <aside class="sidebar">
      <div class="brand"><span class="logo-icy">ICY</span><span class="logo-quant">Quant</span></div>
      <nav id="nav">
        <a href="#/overview" data-nav="overview" class="nav-link active"><span class="nav-ico">◈</span>Overview</a>
        <a href="#/strategies" data-nav="strategies" class="nav-link"><span class="nav-ico">◉</span>Strategy</a>
        <a href="#/risk" data-nav="risk" class="nav-link"><span class="nav-ico">▲</span>Risk</a>
        <a href="#/orders" data-nav="orders" class="nav-link"><span class="nav-ico">≡</span>Orders</a>
        <a href="#/executions" data-nav="executions" class="nav-link"><span class="nav-ico">✕</span>Executions</a>
        <a href="#/portfolio" data-nav="portfolio" class="nav-link"><span class="nav-ico">▤</span>Portfolio</a>
        <a href="#/accounts" data-nav="accounts" class="nav-link"><span class="nav-ico">▦</span>Accounts</a>
        <a href="#/reconciliation" data-nav="reconciliation" class="nav-link"><span class="nav-ico">◍</span>Reconciliation</a>
        <a href="#/system" data-nav="system" class="nav-link"><span class="nav-ico">⬡</span>System</a>
        <a href="#/alerts" data-nav="alerts" class="nav-link"><span class="nav-ico">❗</span>Alerts</a>
      </nav>
      <div class="sidebar-footer">
        <span id="conn-dot" class="conn-dot"></span>
        <span id="conn-text" class="conn-text">connecting…</span>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <h1 id="page-title">Overview</h1>
        </div>
        <div class="topbar-right">
          <span id="session-chip" class="chip hidden"></span>
          <span id="user-badge" class="user-badge"></span>
          <button id="btn-logout" class="btn btn-ghost">Sign out</button>
        </div>
      </header>
      <section id="page-content" class="content"></section>
    </main>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="/dashboard/js/api.js"></script>
  <script src="/dashboard/js/app.js"></script>
</body>
</html>
